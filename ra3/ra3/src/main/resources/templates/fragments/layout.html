<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo ?: 'Gestión de Jugadores de Videojuegos'}">
        Gestión de Jugadores
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" th:fragment="cabecera">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/jugadores}">
                Gestión de Jugadores de Videojuegos
            </a>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
				<ul class="navbar-nav">

				    <li class="nav-item" sec:authorize="!isAuthenticated()">
				        <a class="nav-link btn btn-outline-light" th:href="@{/login}">
				            Inicia Sesión
				        </a>
				    </li>

				    <li class="nav-item" sec:authorize="isAuthenticated()">
				        <form th:action="@{/logout}" method="post" class="d-inline">
				            <button type="submit" class="nav-link btn btn-outline-light">
				                Cerrar sesión
				            </button>
				        </form>
				    </li>

				</ul>
            </div>
        </div>
    </nav>

    <main class="container py-5 flex-grow-1">
        <div th:fragment="contenido"></div>
    </main>


    <footer class="bg-dark text-white text-center py-3 mt-5" th:fragment="pie">
        <div class="container">
            <small>© 2026 - Proyecto RA3</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
