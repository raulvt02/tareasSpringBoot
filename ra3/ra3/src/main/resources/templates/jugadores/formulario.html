<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario Jugador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0" th:text="${jugador.id == null ? 'Nuevo Jugador' : 'Editar Jugador'}"></h5>
                    </div>
                    <div class="card-body">
                        <form th:object="${jugador}" th:action="@{/jugadores}" method="post">
                            <input type="hidden" th:field="*{id}"/>

                            <div class="mb-3">
                                <label for="nickname" class="form-label">Nickname</label>
                                <input type="text" th:field="*{nickname}" class="form-control" id="nickname" th:classappend="${#fields.hasErrors('nickname')} ? 'is-invalid' : ''"/>
                                <div class="invalid-feedback" th:errors="*{nickname}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="edad" class="form-label">Edad</label>
                                <input type="number" th:field="*{edad}" class="form-control" id="edad" th:classappend="${#fields.hasErrors('edad')} ? 'is-invalid' : ''"/>
                                <div class="invalid-feedback" th:errors="*{edad}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" th:field="*{email}" class="form-control" id="email" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"/>
                                <div class="invalid-feedback" th:errors="*{email}"></div>
                            </div>

                            <button type="submit" class="btn btn-success">Guardar</button>
                            <a href="/jugadores" class="btn btn-secondary">Cancelar</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
