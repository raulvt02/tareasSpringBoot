<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head}"></head>

<body>

<div th:replace="~{fragments/layout :: cabecera}"></div>

<div class="container mt-5">
    <h1 class="mb-4">Jugadores de Videojuegos</h1>

    <a sec:authorize="hasRole('ADMIN')"
       href="/jugadores/nuevo"
       class="btn btn-primary mb-3">
        Añadir nuevo jugador
    </a>

    <div class="table-responsive">
        <table class="table table-striped table-hover table-bordered">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nickname</th>
                <th>Edad</th>
                <th>Email</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="jugador : ${jugadores}">
                <td th:text="${jugador.id}"></td>
                <td th:text="${jugador.nickname}"></td>
                <td th:text="${jugador.edad}"></td>
                <td th:text="${jugador.email}"></td>
                <td>

                    <span sec:authorize="!isAuthenticated()">
                        <a href="/login" class="btn btn-sm btn-outline-primary">
                            Inicia sesión para ver más
                        </a>
                    </span>

					<span sec:authorize="hasRole('USER') and !hasRole('ADMIN')">
					    <a th:href="@{/jugadores/detalles/{id}(id=${jugador.id})}"
					       class="btn btn-sm btn-info">
					        Ver detalles
					    </a>
					</span>

                    <span sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/jugadores/editar/{id}(id=${jugador.id})}"
                           class="btn btn-sm btn-warning">
                            Editar
                        </a>

                        <a th:href="@{/jugadores/eliminar/{id}(id=${jugador.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('¿Seguro?')">
                            Eliminar
                        </a>
                    </span>

                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <p th:if="${jugadores.isEmpty()}" class="text-muted mt-3">
        No hay jugadores registrados aún.
    </p>
</div>

<div th:replace="~{fragments/layout :: pie}"></div>

</body>
</html>
