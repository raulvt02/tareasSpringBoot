<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Jugadores</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Jugadores de Videojuegos</h1>
        <a href="/jugadores/nuevo" class="btn btn-primary mb-3">Añadir nuevo jugador</a>

        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nickname</th>
                        <th>Edad</th>
                        <th>Email</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="jugador : ${jugadores}">
                        <td th:text="${jugador.id}"></td>
                        <td th:text="${jugador.nickname}"></td>
                        <td th:text="${jugador.edad}"></td>
                        <td th:text="${jugador.email}"></td>
                        <td>
                            <a th:href="@{/jugadores/editar/{id}(id=${jugador.id})}" class="btn btn-sm btn-warning">Editar</a>
                            <a th:href="@{/jugadores/eliminar/{id}(id=${jugador.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Seguro que quieres eliminar este jugador?')">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p th:if="${jugadores.isEmpty()}" class="text-muted mt-3">No hay jugadores registrados aún.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
